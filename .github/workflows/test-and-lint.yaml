name: Unit Test and Lint

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.25"

      - name: Run unit test
        run: make test

      - name: Lint with golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.15.0"
